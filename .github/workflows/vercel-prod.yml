name: Vercel (prod)

on:
  pull_request:
    branches: [main]
  push:
    branches: [prod]

concurrency:
  group: vercel-prod-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy-preview:
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link Vercel project
        run: bash .github/scripts/link-vercel.sh
      - name: Pull Vercel preview env
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)
          case "$URL" in
            https://*) ;;
            *) echo "Unexpected deploy output: $URL" >&2; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $URL"
      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${{ steps.deploy.outputs.url }}/health"
      - name: Comment PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "$(cat <<EOF
          Preview deployed: ${{ steps.deploy.outputs.url }}

          Health: ${{ steps.deploy.outputs.url }}/health

          Telegram webhook was **not** updated (preview only).
          EOF
          )"

  deploy-production:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link Vercel project
        run: bash .github/scripts/link-vercel.sh
      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)
          case "$URL" in
            https://*) ;;
            *) echo "Unexpected deploy output: $URL" >&2; exit 1 ;;
          esac
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production: $URL"
      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${{ steps.deploy.outputs.url }}/health"
      - name: Set Telegram webhook
        run: |
          if [ ! -f .vercel/.env.production.local ]; then
            echo ".vercel/.env.production.local missing after vercel pull" >&2
            exit 1
          fi
          cp .vercel/.env.production.local .env
          npm run webhook:set
